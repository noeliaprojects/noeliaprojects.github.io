<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noelia · Projectes</title>
  <meta name="description" content="Ingeniera electrónica y maestra de inglés. Apps, webs, herramientas para el aula y cuentos.">
  <meta property="og:title" content="Noelia · Projectes">
  <meta property="og:description" content="Ingeniera electrónica y maestra de inglés. Apps, webs, herramientas para el aula y cuentos.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="home">
  <a class="skip" href="#main">Salta al contingut</a>

  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="index.html">Noelia<span>.</span></a>
      <nav class="nav" aria-label="Principal">
        <a href="index.html#projects" data-i18n="nav.projects">Projectes</a>
        <a href="recorregut.html" data-i18n="nav.journey">Recorregut</a>
        <a href="raco.html" data-i18n="nav.corner">El meu racó</a>
        <a href="#contact" data-i18n="nav.contact">Contacte</a>
      </nav>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="ca" title="Català">
          <span class="flag" aria-hidden="true"><svg viewBox="0 0 18 18"><rect width="18" height="18" fill="#FCDD09"/><g fill="#DA121A"><rect y="2" width="18" height="2"/><rect y="6" width="18" height="2"/><rect y="10" width="18" height="2"/><rect y="14" width="18" height="2"/></g></svg></span>CA</button>
        <button type="button" data-lang="es" title="Español">
          <span class="flag" aria-hidden="true"><svg viewBox="0 0 18 18"><rect width="18" height="18" fill="#C60B1E"/><rect y="4.5" width="18" height="9" fill="#FFC400"/></svg></span>ES</button>
        <button type="button" data-lang="en" title="English">
          <span class="flag" aria-hidden="true"><svg viewBox="0 0 18 18"><rect width="18" height="18" fill="#012169"/><path d="M0 0L18 18M18 0L0 18" stroke="#fff" stroke-width="3.6"/><path d="M0 0L18 18M18 0L0 18" stroke="#C8102E" stroke-width="1.2"/><path d="M9 0V18M0 9H18" stroke="#fff" stroke-width="5"/><path d="M9 0V18M0 9H18" stroke="#C8102E" stroke-width="3"/></svg></span>EN</button>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- PRESENTACIÓN -->
    <section class="hero" id="top">
      <div class="wrap hero__inner">
        <div class="hero__text">
          <p class="hero__hello" data-i18n="hero.hello">Hola, soy</p>
          <h1 class="hero__name">
            <span id="person-name">Noelia</span>
            <svg class="scribble" viewBox="0 0 300 18" preserveAspectRatio="none" aria-hidden="true">
              <path d="M3 12 C 60 4, 120 16, 180 8 S 270 6, 297 11" />
            </svg>
          </h1>
          <p class="hero__lead" data-i18n="hero.lead"></p>
          <p class="hand hero__note" aria-hidden="true">↳ <span data-i18n="hero.note">sigo aprendiendo</span></p>
          <div class="hero__actions">
            <a class="btn btn--solid" href="#projects" data-i18n="hero.cta">Ver proyectos</a>
            <a class="btn" href="recorregut.html" data-i18n="hero.journey">El meu recorregut</a>
            <a class="btn btn--ghost" id="hero-mail" href="#contact" data-i18n="hero.contact">Escríbeme</a>
            <a class="btn btn--ghost" id="hero-cv" href="#" download hidden data-i18n="hero.cv">Descargar CV</a>
          </div>
        </div>
        <figure class="hero__photo" id="hero-photo" hidden>
          <img src="" alt="Noelia" width="220" height="260">
        </figure>
      </div>
    </section>

    <!-- PROYECTOS -->
    <section class="section" id="projects">
      <div class="wrap">
        <h2 class="section__title"><span data-i18n="projects.title">Els meus projectes</span></h2>
        <div id="shelves"></div>
      </div>
    </section>

    <!-- CONTACTO -->
    <section class="section contact" id="contact">
      <div class="wrap contact__inner">
        <h2 class="contact__title" data-i18n="contact.title">¿Hablamos?</h2>
        <p data-i18n="contact.text"></p>
        <a class="contact__mail" id="contact-mail" href="#"></a>
        <ul class="socials" id="socials"></ul>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="i18n.js"></script>
  <script src="main.js"></script>
</body>
</html>
